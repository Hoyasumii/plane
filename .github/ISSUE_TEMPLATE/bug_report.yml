name: Bug report
description: Something in the SDK, the MCP server or the CLI does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here: report them privately, as [SECURITY.md](https://github.com/Hoyasumii/plane/blob/main/SECURITY.md) describes.
        Never paste an API key or access token, and check that logs and responses carry none.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SDK — v1 (client.workItems, client.cycles, …)
        - SDK — v2 (client.v2)
        - MCP server (plane-mcp)
        - CLI (plane)
        - OAuth (OAuthClient)
        - Docs site
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Include the full error.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code or command that shows it.
      render: typescript
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: "@hoyasumii/plane version"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: plane-version
    attributes:
      label: Plane instance
      description: Plane Cloud, or the self-hosted version. Self-hosted 1.4.x has no /api/v2.
      placeholder: "Plane Cloud / self-hosted 1.4.2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and OS
      description: For the MCP server or the CLI, say also which client runs it (Claude Code, Codex, OpenCode) and whether through WSL.
      placeholder: "Node 22.11, Ubuntu 24.04 on WSL2"
